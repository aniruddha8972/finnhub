resources:
  jobs:
    monthly_process:
      name: ${bundle.target}_monthly_process
      schedule:
        quartz_cron_expression: 54 30 17 1 * ?
        timezone_id: US/Eastern
        pause_status: UNPAUSED
      tasks:
        - task_key: ${bundle.target}_finnhubb_monthly_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: m101_finnhub
              process_name: finnhub_monthly_ingestion
              run_type: scheduled
              execution_type: ingestion
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
          environment_key: finnhubb_monthly_ingestion_environment
        - task_key: ${bundle.target}_sadp_monthly_load
          depends_on:
            - task_key: ${bundle.target}_finnhubb_monthly_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: finnhub_dp
              process_name: finnhub_dp_monthly_load
              run_type: scheduled
              execution_type: consumption_SADP
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
        - task_key: ${bundle.target}_aadp_monthly_load
          depends_on:
            - task_key: ${bundle.target}_sadp_monthly_load
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: aadp_finnhub
              process_name: aadp_monthly_stocks_load
              run_type: scheduled
              execution_type: consumption_AADP
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
      queue:
        enabled: true
      environments:
        - environment_key: finnhubb_monthly_ingestion_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
