resources:
  jobs:
    daily_process:
      name: ${bundle.target}_daily_process
      timeout_seconds: 7200
      tasks:
        - task_key: ${bundle.target}_run_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: m101_finnhub
              process_name: finnhub_daily_ingestion
              run_type: scheduled
              execution_type: ingestion
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
          environment_key: Default
        - task_key: ${bundle.target}_sadp_daily_load
          depends_on:
            - task_key: ${bundle.target}_run_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: finnhub_dp
              process_name: finnhub_dp_daily_load
              run_type: scheduled
              execution_type: consumption_SADP
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
        - task_key: ${bundle.target}_aadp_daily_load
          depends_on:
            - task_key: ${bundle.target}_sadp_daily_load
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: ${var.environment}
              param_name: aadp_finnhub
              process_name: aadp_daily_stocks_load
              run_type: scheduled
              execution_type: consumption_AADP
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: "0 30 16 * * ?"
        timezone_id: US/Eastern
