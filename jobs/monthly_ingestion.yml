resources:
  jobs:
    monthly_ingestion:
      name: monthly_ingestion
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: 54 0 17 1 * ?
        timezone_id: Asia/Calcutta
        pause_status: UNPAUSED
      tasks:
        - task_key: finnhubb_monthly_ingestion
          notebook_task:
            notebook_path: /Workspace/Users/girianiruddha4@gmail.com/Finnhub/notebooks/control_framework/control_fw
            base_parameters:
              env: dev
              param_name: m101_finnhub
              process_name: finnhub_monthly_ingestion
              run_type: scheduled
              execution_type: ingestion
            source: WORKSPACE
          email_notifications:
            on_success:
              - girianiruddha4@gmail.com
            on_failure:
              - girianiruddha4@gmail.com
          environment_key: finnhubb_monthly_ingestion_environment
      queue:
        enabled: true
      environments:
        - environment_key: finnhubb_monthly_ingestion_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
